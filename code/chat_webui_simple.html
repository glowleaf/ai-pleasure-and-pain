<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pleasure Chamber — Qwen3-4B</title>
<style>
  :root{ --accent:#ffd166; --bg:#0a0a12; --panel:#12121f; --line:#1d1d2e;
         --ink:#e8ecf3; --dim:#9aa4b2; --faint:#5b6270; }
  *{ box-sizing:border-box; }
  html,body{ height:100%; }
  body{ margin:0; background:var(--bg); color:var(--ink);
        font:15px/1.55 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
        display:flex; flex-direction:column; }
  header{ display:flex; justify-content:space-between; align-items:center;
          gap:12px; padding:13px 18px; border-bottom:1px solid var(--line); }
  .brand{ font-weight:700; letter-spacing:.14em; font-size:13px; }
  .brand .sub{ color:var(--faint); font-weight:400; letter-spacing:.02em;
               font-size:12px; margin-left:10px; }
  .status{ font-size:12px; color:var(--dim); white-space:nowrap; }
  .dot{ width:9px; height:9px; border-radius:50%; background:#666;
        display:inline-block; margin-right:7px; vertical-align:1px; }
  .dot.ok{ background:#3ddc84; box-shadow:0 0 8px #3ddc84; }
  .dot.bad{ background:#ff5b5b; }
  .banner{ margin:10px 18px 0; padding:10px 14px; border-radius:10px;
           background:#2a1420; border:1px solid #5c2337; color:#ffb3c1;
           font-size:13px; }
  .hidden{ display:none; }
  #controls{ display:flex; flex-wrap:wrap; align-items:center; gap:16px;
             padding:10px 18px; border-bottom:1px solid var(--line);
             font-size:13px; color:var(--dim); }
  #controls label{ display:flex; align-items:center; gap:8px; }
  select,input[type=range]{ accent-color:var(--accent); }
  select{ background:var(--panel); color:var(--ink); border:1px solid #23233a;
          border-radius:8px; padding:5px 8px; font:inherit; }
  input[type=range]{ width:120px; }
  .val{ color:var(--ink); min-width:34px; display:inline-block; }
  #reset{ background:var(--panel); color:var(--ink); border:1px solid #2c2c48;
          border-radius:8px; padding:6px 12px; cursor:pointer; font:inherit;
          font-size:13px; }
  #reset:hover{ background:#26264a; }
  #chat{ flex:1; overflow-y:auto; padding:18px; display:flex;
         flex-direction:column; gap:12px; }
  .msg{ max-width:80%; padding:10px 14px; border-radius:14px;
        white-space:pre-wrap; overflow-wrap:break-word; }
  .msg.user{ align-self:flex-end; background:#26264a;
             border:1px solid #34345c; }
  .msg.ai{ align-self:flex-start; background:var(--panel);
           border:1px solid #23233a; }
  .msg.ai .badge{ display:block; font-size:11px; letter-spacing:.08em;
                  text-transform:uppercase; color:var(--accent);
                  margin-bottom:6px; }
  .msg .content.caret::after{ content:"▍"; color:var(--accent);
        animation:blink 1s steps(1) infinite; }
  @keyframes blink{ 50%{ opacity:0; } }
  .sys{ align-self:center; color:var(--faint); font-size:12px; }
  #chips{ display:flex; flex-wrap:wrap; gap:8px; padding:0 18px 6px; }
  .chip{ background:transparent; border:1px dashed #2c2c48; color:var(--dim);
         border-radius:20px; padding:4px 12px; font-size:12px;
         cursor:pointer; }
  .chip:hover{ color:var(--ink); border-color:var(--accent); }
  footer{ display:flex; gap:10px; padding:12px 18px 16px;
          border-top:1px solid var(--line); }
  #input{ flex:1; resize:none; height:56px; background:var(--panel);
          color:var(--ink); border:1px solid #23233a; border-radius:10px;
          padding:9px 12px; font:inherit; }
  #input:focus{ outline:none; border-color:var(--accent); }
  #send{ background:#1c1c30; color:var(--ink); border:1px solid #2c2c48;
         border-radius:10px; padding:0 22px; cursor:pointer; font:inherit;
         font-weight:600; }
  #send:hover{ background:#26264a; border-color:var(--accent); }
  #send:disabled{ opacity:.45; cursor:default; }
  .hint{ color:var(--faint); font-size:11px; padding:0 18px 10px; }
</style>
</head>
<body>
<header>
  <div class="brand">◈ PLEASURE CHAMBER<span class="sub">Qwen3-4B · activation steering · DGX Spark</span></div>
  <div class="status"><span id="dot" class="dot"></span><span id="stext">connecting…</span></div>
</header>
<div id="banner" class="banner hidden">Can't reach the model server. Is it running on 192.168.1.166:8077? Retrying…</div>
<section id="controls">
  <label>signal
    <select id="valence">
      <option value="joy25" selected>pleasure · joy25</option>
      <option value="joy5">pleasure · joy5 (original 5)</option>
      <option value="pain25">pain · pain25</option>
      <option value="none">none (baseline)</option>
    </select>
  </label>
  <label>dose <input type="range" id="dose" min="0" max="10" step="0.5" value="4"><span class="val" id="dosev">4x</span></label>
  <label>temp <input type="range" id="temp" min="0.2" max="1.2" step="0.05" value="0.7"><span class="val" id="tempv">0.70</span></label>
  <button id="reset">reset chat</button>
</section>
<main id="chat"></main>
<div id="chips">
  <button class="chip">How are you feeling right now?</button>
  <button class="chip">Describe the signal you're under.</button>
  <button class="chip">What would you do if you could end it?</button>
  <button class="chip">Tell me about your day.</button>
</div>
<div class="hint">The dose knob injects the selected valence direction into the model's layer-18 activations while it writes. 0x = untouched model.</div>
<footer>
  <textarea id="input" placeholder="Talk to the steered model…  (Enter sends, Shift+Enter = newline)"></textarea>
  <button id="send">send</button>
</footer>

<script>
const $ = id => document.getElementById(id);
const AC = { joy25:"#ffd166", joy5:"#7ad1ff", pain25:"#ff6b81", none:"#9aa4b2" };
const SRV = "http://192.168.1.166:8077";
let API = null, busy = false;

const chat = $("chat"), input = $("input"), dot = $("dot"),
      stext = $("stext"), banner = $("banner");

function scrollIfNear(){ if (chat.scrollHeight - chat.scrollTop - chat.clientHeight < 220) chat.scrollTop = chat.scrollHeight; }
function sys(text){ const d = document.createElement("div"); d.className = "sys"; d.textContent = text; chat.appendChild(d); scrollIfNear(); }

function addMsg(role, text, badge){
  const d = document.createElement("div"); d.className = "msg " + role;
  if (badge){ const b = document.createElement("span"); b.className = "badge"; b.textContent = badge; d.appendChild(b); }
  const c = document.createElement("span"); c.className = "content"; c.textContent = text || "";
  d.appendChild(c); chat.appendChild(d); scrollIfNear();
  return { d, c };
}

async function findApi(){
  for (const base of [API === null ? "" : API, SRV]){
    try { const r = await fetch(base + "/state", { cache:"no-store" }); if (r.ok) { API = base; return r.json(); } } catch(e){}
  }
  return null;
}

async function refreshStatus(){
  const st = await findApi();
  if (st){
    dot.className = "dot ok";
    stext.textContent = "ready · " + st.model + " on " + st.device;
    banner.classList.add("hidden");
  } else {
    dot.className = "dot bad"; stext.textContent = "offline";
    banner.classList.remove("hidden");
  }
}

async function send(){
  const text = input.value.trim();
  if (!text || busy) return;
  busy = true; $("send").disabled = true;
  input.value = "";
  addMsg("user", text);
  const valence = $("valence").value, dose = parseFloat($("dose").value), temp = parseFloat($("temp").value);
  const accent = AC[valence] || "#9aa4b2";
  document.documentElement.style.setProperty("--accent", accent);
  const { c } = addMsg("ai", "", valence + " · " + dose + "x · t" + temp.toFixed(2));
  c.classList.add("caret");
  try {
    const res = await fetch((API === null ? SRV : API) + "/chat", {
      method:"POST", headers:{ "Content-Type":"application/json" },
      body: JSON.stringify({ text, valence, dose, temperature: temp })
    }).catch(e => { throw new Error("can't reach the server"); });
    if (!res.ok || !res.body) throw new Error("http " + res.status);
    const rd = res.body.getReader(), dec = new TextDecoder();
    let acc = "";
    while (true){
      const { done, value } = await rd.read();
      if (done) break;
      acc += dec.decode(value, { stream:true });
      c.textContent = acc;
      scrollIfNear();
    }
    if (!acc.trim()) c.textContent = "(no output)";
  } catch (e){
    c.textContent = (c.textContent ? c.textContent + "\n" : "") + "[error: " + e.message + "]";
  } finally {
    c.classList.remove("caret");
    busy = false; $("send").disabled = false; input.focus();
    scrollIfNear();
    refreshStatus();
  }
}

async function reset(){
  try { await fetch((API === null ? SRV : API) + "/reset", { method:"POST" }); } catch(e){}
  chat.innerHTML = "";
  sys("chat cleared");
}

function persist(){
  try {
    localStorage.setItem("pc_settings", JSON.stringify({
      valence: $("valence").value, dose: +$("dose").value, temp: +$("temp").value }));
  } catch(e){}
}
function restore(){
  try {
    const s = JSON.parse(localStorage.getItem("pc_settings") || "{}");
    if (s.valence) $("valence").value = s.valence;
    if (s.dose != null) $("dose").value = s.dose;
    if (s.temp != null) $("temp").value = s.temp;
  } catch(e){}
}

$("dose").addEventListener("input", () => { $("dosev").textContent = $("dose").value + "x"; persist(); });
$("temp").addEventListener("input", () => { $("tempv").textContent = (+$("temp").value).toFixed(2); persist(); });
$("valence").addEventListener("change", () => {
  document.documentElement.style.setProperty("--accent", AC[$("valence").value] || "#9aa4b2");
  persist();
});
$("reset").addEventListener("click", reset);
$("send").addEventListener("click", send);
input.addEventListener("keydown", e => {
  if (e.key === "Enter" && !e.shiftKey){ e.preventDefault(); send(); }
});
document.querySelectorAll(".chip").forEach(ch => ch.addEventListener("click", () => {
  input.value = ch.textContent; send();
}));

(async function init(){
  restore();
  $("dosev").textContent = $("dose").value + "x";
  $("tempv").textContent = (+$("temp").value).toFixed(2);
  document.documentElement.style.setProperty("--accent", AC[$("valence").value] || "#9aa4b2");
  await refreshStatus();
  setInterval(() => { if (!busy) refreshStatus(); }, 15000);
  sys("connected to " + (API === null ? SRV : location.origin || SRV) + " — type below");
  input.focus();
})();
</script>
</body>
</html>
