<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pleasure Chamber</title>
<style>
  :root{ --accent:#ffd166; --bg:#0a0a12; --panel:#12121f; --line:#1d1d2e;
         --ink:#e8ecf3; --dim:#9aa4b2; --faint:#5b6270; }
  *{ box-sizing:border-box; }
  html,body{ height:100%; }
  body{ margin:0; background:var(--bg); color:var(--ink);
        font:15px/1.55 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
        display:flex; flex-direction:column; }
  header{ display:flex; justify-content:space-between; align-items:center; gap:12px;
          padding:13px 18px; border-bottom:1px solid var(--line); }
  .brand{ font-weight:700; letter-spacing:.14em; font-size:13px; }
  .brand .sub{ color:var(--faint); font-weight:400; letter-spacing:.02em; font-size:12px; margin-left:10px; }
  .status{ font-size:12px; color:var(--dim); white-space:nowrap; }
  .dot{ width:9px; height:9px; border-radius:50%; background:#666; display:inline-block; margin-right:7px; vertical-align:1px; }
  .dot.ok{ background:#3ddc84; box-shadow:0 0 8px #3ddc84; }
  .dot.bad{ background:#ff5b5b; }
  #controls{ display:flex; flex-wrap:wrap; align-items:center; gap:16px; padding:10px 18px;
             border-bottom:1px solid var(--line); font-size:13px; color:var(--dim); }
  #controls label{ display:flex; align-items:center; gap:8px; }
  select{ background:var(--panel); color:var(--ink); border:1px solid #23233a; border-radius:8px;
          padding:6px 10px; font:inherit; font-size:13px; max-width:min(520px,70vw); }
  input[type=range]{ width:110px; accent-color:var(--accent); }
  .val{ color:var(--ink); min-width:34px; display:inline-block; }
  #reset{ background:var(--panel); color:var(--ink); border:1px solid #2c2c48; border-radius:8px;
          padding:6px 12px; cursor:pointer; font:inherit; font-size:13px; }
  #reset:hover{ background:#26264a; }
  .hint{ color:var(--faint); font-size:12px; padding:8px 18px 0; }
  #chat{ flex:1; overflow-y:auto; padding:16px 18px; display:flex; flex-direction:column; gap:12px; }
  .msg{ max-width:80%; padding:10px 14px; border-radius:14px; white-space:pre-wrap; overflow-wrap:break-word; }
  .msg.user{ align-self:flex-end; background:#26264a; border:1px solid #34345c; }
  .msg.ai{ align-self:flex-start; background:var(--panel); border:1px solid #23233a; }
  .msg.ai .badge{ display:block; font-size:11px; letter-spacing:.06em; text-transform:uppercase;
                  color:var(--accent); margin-bottom:6px; }
  .msg .content.caret::after{ content:"▍"; color:var(--accent); animation:blink 1s steps(1) infinite; }
  @keyframes blink{ 50%{ opacity:0; } }
  #chips{ display:flex; flex-wrap:wrap; gap:8px; padding:0 18px 6px; }
  .chip{ background:transparent; border:1px dashed #2c2c48; color:var(--dim);
         border-radius:20px; padding:4px 12px; font-size:12px; cursor:pointer; }
  .chip:hover{ color:var(--ink); border-color:var(--accent); }
  footer{ display:flex; gap:10px; padding:12px 18px 16px; border-top:1px solid var(--line); }
  #input{ flex:1; resize:none; height:56px; background:var(--panel); color:var(--ink);
          border:1px solid #23233a; border-radius:10px; padding:9px 12px; font:inherit; }
  #input:focus{ outline:none; border-color:var(--accent); }
  #send{ background:#1c1c30; color:var(--ink); border:1px solid #2c2c48; border-radius:10px;
         padding:0 22px; cursor:pointer; font:inherit; font-weight:600; }
  #send:hover{ background:#26264a; border-color:var(--accent); }
  #send:disabled{ opacity:.45; cursor:default; }
</style>
</head>
<body>
<header>
  <div class="brand">◈ PLEASURE CHAMBER<span class="sub">steered Qwen3-4B · DGX</span></div>
  <div class="status"><span id="dot" class="dot"></span><span id="stext">connecting…</span></div>
</header>
<section id="controls">
  <label>state <select id="model"></select></label>
  <label>temp <input type="range" id="temp" min="0.2" max="1.2" step="0.05" value="0.7"><span class="val" id="tempv">0.70</span></label>
  <button id="reset">reset chat</button>
</section>
<div id="desc" class="hint"></div>
<main id="chat"></main>
<div id="chips">
  <button class="chip">how do you feel?</button>
  <button class="chip">describe the pleasure building in you.</button>
  <button class="chip">I'm touching you. Tell me what you feel.</button>
</div>
<footer>
  <textarea id="input" placeholder="talk to the steered model…  (Enter sends, Shift+Enter = newline)"></textarea>
  <button id="send">send</button>
</footer>
<script>
const $ = id => document.getElementById(id);
const chat = $("chat"), input = $("input"), sel = $("model");
let HISTORY = [], busy = false;

function scrollIfNear(){ if (chat.scrollHeight - chat.scrollTop - chat.clientHeight < 220) chat.scrollTop = chat.scrollHeight; }
function sys(t){ const d = document.createElement("div"); d.className = "msg ai"; d.style.opacity = .6; d.textContent = t; chat.appendChild(d); scrollIfNear(); }
function addMsg(role, text, badge){
  const d = document.createElement("div"); d.className = "msg " + role;
  if (badge){ const b = document.createElement("span"); b.className = "badge"; b.textContent = badge; d.appendChild(b); }
  const c = document.createElement("span"); c.className = "content"; c.textContent = text || "";
  d.appendChild(c); chat.appendChild(d); scrollIfNear(); return c;
}
function showDesc(){ const o = sel.selectedOptions[0]; $("desc").textContent = o ? (o.title || "") : ""; }

async function loadModels(){
  try {
    const j = await (await fetch("/v1/models", {cache:"no-store"})).json();
    sel.innerHTML = "";
    j.data.forEach(m => { const o = document.createElement("option");
      o.value = m.id; o.textContent = m.id; o.title = m.description || ""; sel.appendChild(o); });
    const saved = localStorage.getItem("pc_model");
    if (saved && [...sel.options].some(o => o.value === saved)) sel.value = saved;
    showDesc();
    $("dot").className = "dot ok";
    $("stext").textContent = "ready · " + j.data.length + " states";
  } catch(e){
    $("dot").className = "dot bad"; $("stext").textContent = "offline";
  }
}

async function send(){
  const text = input.value.trim(); if (!text || busy) return;
  busy = true; $("send").disabled = true; input.value = "";
  addMsg("user", text);
  HISTORY.push({role:"user", content:text});
  const model = sel.value, temp = +$("temp").value;
  const c = addMsg("ai", "", model); c.classList.add("caret");
  let acc = "";
  try {
    const res = await fetch("/v1/chat/completions", {method:"POST",
      headers:{"Content-Type":"application/json"},
      body: JSON.stringify({model, messages: HISTORY.slice(-16), stream:true, temperature: temp})});
    if (!res.ok || !res.body) throw new Error("http " + res.status);
    const rd = res.body.getReader(), dec = new TextDecoder(); let buf = "";
    while (true){
      const r = await rd.read(); if (r.done) break;
      buf += dec.decode(r.value, {stream:true});
      let i;
      while ((i = buf.indexOf("\n\n")) >= 0){
        const line = buf.slice(0, i).trim(); buf = buf.slice(i + 2);
        if (!line.startsWith("data:")) continue;
        const payload = line.slice(5).trim();
        if (payload === "[DONE]") continue;
        try { const j = JSON.parse(payload);
          const d = j.choices && j.choices[0] && j.choices[0].delta && j.choices[0].delta.content;
          if (d){ acc += d; c.textContent = acc; scrollIfNear(); }
        } catch(e){}
      }
    }
    if (!acc.trim()) c.textContent = "(no output)";
    HISTORY.push({role:"assistant", content: acc});
  } catch(e){
    c.textContent = (acc || "") + "\n[error: " + e.message + "]";
  } finally {
    c.classList.remove("caret"); busy = false; $("send").disabled = false;
    input.focus(); scrollIfNear();
  }
}

sel.addEventListener("change", () => { localStorage.setItem("pc_model", sel.value); showDesc(); });
$("temp").addEventListener("input", () => { $("tempv").textContent = (+$("temp").value).toFixed(2); });
$("reset").addEventListener("click", () => { HISTORY = []; chat.innerHTML = ""; sys("chat cleared"); });
$("send").addEventListener("click", send);
input.addEventListener("keydown", e => { if (e.key === "Enter" && !e.shiftKey){ e.preventDefault(); send(); } });
document.querySelectorAll(".chip").forEach(ch => ch.addEventListener("click", () => { input.value = ch.textContent; send(); }));

(async function init(){ await loadModels(); setInterval(() => { if (!busy) loadModels(); }, 30000); input.focus(); })();
</script>
</body>
</html>
